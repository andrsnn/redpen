<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04 — Check yourself</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#e6e8eb}
  body{display:flex;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
  .slide{position:relative;width:1280px;height:720px;flex:none;background:#f4f5f7;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.15);color:#232a33}
  .abs{position:absolute}
  .eyebrow{left:64px;top:64px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#8a929e}
  .title{left:62px;top:98px;width:1152px;font-size:40px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
  .flow{left:64px;bottom:28px;width:1152px;font-size:11px;color:#8a929e;letter-spacing:.02em}
  .pageno{left:1218px;top:683px;font-size:11px;font-weight:500;letter-spacing:.18em}
  .b{--c:#3563e3;--gh:#dde6fb}.g{--c:#3f9168;--gh:#d9ebe0}.v{--c:#6b4fd8;--gh:#e4def9}.o{--c:#c47a1f;--gh:#f3e4cf}
  .k{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
  .card{background:#fff;border:1px solid #dfe3e8;border-top:5px solid var(--c);border-radius:14px;padding:18px 20px}
  .card .h{margin-top:6px;font-size:26px;font-weight:800}
  .card .d{margin-top:8px;font-size:18px;line-height:1.35;color:#3d4550}
  .q{left:64px;width:1152px;background:#fff;border:1px solid #dfe3e8;border-left:6px solid #3563e3;border-radius:12px;padding:18px 24px;font-size:23px;line-height:1.35}
</style>
</head>
<body>
<div class="slide">
  <div class="abs eyebrow">Quick check</div>
  <div class="abs title">Check yourself</div>
  <div class="abs q" style="top:200px">1. A page you typed the address of returns 404. Whose problem is it?</div>
  <div class="abs q" style="top:300px">2. You send POST /orders and get 201. What happened?</div>
  <div class="abs q" style="top:400px">3. A page that worked yesterday now returns 503. Can you fix it from the browser?</div>
  <div class="abs flow">03 · Status codes → End of deck</div>
  <div class="abs pageno">04</div>
</div>
<script type="text/x-notes">
- Answers: 1) the caller, a 4xx means the request was wrong. 2) A new order was created. 3) No, a 5xx means the server has the problem.
</script>
</body>
</html>
